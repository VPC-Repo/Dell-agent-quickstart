# Schema migrations. The application applies these itself at startup
# (backend/store.py); this file exists for the alembic CLI during development:
#   .venv/bin/alembic revision --autogenerate -m "describe the change"
#   .venv/bin/alembic upgrade head
[alembic]
script_location = migrations
# Empty: env.py falls back to DATABASE_URL, then the development SQLite file.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
