[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dell-agent-quickstart"
version = "0.11.0"
description = "Install a local AI agent stack on one server and run eight example agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.52.4", "sqlalchemy==2.0.52",
  "httpx==0.28.1", "langchain==1.4.0",
  "langchain-openai==1.6.2", "deepagents==0.7.13", "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1", "langgraph-checkpoint-postgres==3.1.2",
  "psycopg[binary]==3.3.5", "jsonschema==4.26.0", "psutil==7.2.2",
  "alembic==1.16.5", "pypdf==6.19.0", "redis==8.1.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["backend*", "xeon_runtime*"]

[tool.setuptools.package-data]
xeon_runtime = ["corpus.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
